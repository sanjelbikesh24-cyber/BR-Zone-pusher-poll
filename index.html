<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Free Fire Poll</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: #1f2937;
      padding: 25px;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
    }

    .option {
      display: block;
      background: #374151;
      padding: 15px;
      margin: 12px 0;
      border-radius: 10px;
      cursor: pointer;
    }

    .option:hover {
      background: #4b5563;
    }

    input[type="radio"] {
      margin-right: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    button:disabled {
      background: #6b7280;
      cursor: not-allowed;
    }

    .results {
      margin-top: 30px;
    }

    .result {
      margin: 15px 0;
    }

    .result-name {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .bar {
      height: 15px;
      background: #4b5563;
      border-radius: 10px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      background: #3b82f6;
      width: 0%;
    }

    #message {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🔥 Free Fire Poll</h1>

  <p style="text-align:center;">
    Choose <b>ONE</b> person
  </p>

  <form id="pollForm">

    <label class="option">
      <input type="radio" name="person" value="Person 1">
      Person 1
    </label>

    <label class="option">
      <input type="radio" name="person" value="Person 2">
      Person 2
    </label>

    <label class="option">
      <input type="radio" name="person" value="Person 3">
      Person 3
    </label>

    <label class="option">
      <input type="radio" name="person" value="Person 4">
      Person 4
    </label>

    <button type="submit" id="voteButton">
      VOTE
    </button>

  </form>

  <div id="message"></div>

  <div class="results">

    <h2>📊 Live Results</h2>

    <div class="result">
      <div class="result-name">
        <span>Person 1</span>
        <span id="count1">0 votes</span>
      </div>
      <div class="bar">
        <div class="fill" id="bar1"></div>
      </div>
    </div>

    <div class="result">
      <div class="result-name">
        <span>Person 2</span>
        <span id="count2">0 votes</span>
      </div>
      <div class="bar">
        <div class="fill" id="bar2"></div>
      </div>
    </div>

    <div class="result">
      <div class="result-name">
        <span>Person 3</span>
        <span id="count3">0 votes</span>
      </div>
      <div class="bar">
        <div class="fill" id="bar3"></div>
      </div>
    </div>

    <div class="result">
      <div class="result-name">
        <span>Person 4</span>
        <span id="count4">0 votes</span>
      </div>
      <div class="bar">
        <div class="fill" id="bar4"></div>
      </div>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const people = [
  "Person 1",
  "Person 2",
  "Person 3",
  "Person 4"
];

async function loadResults() {

  const { data, error } = await supabaseClient
    .from("votes")
    .select("person");

  if (error) {
    console.log(error);
    return;
  }

  const counts = {
    "Person 1": 0,
    "Person 2": 0,
    "Person 3": 0,
    "Person 4": 0
  };

  data.forEach(vote => {
    if (counts[vote.person] !== undefined) {
      counts[vote.person]++;
    }
  });

  const total = data.length;

  people.forEach((person, index) => {

    const number = index + 1;
    const votes = counts[person];

    document.getElementById("count" + number).textContent =
      votes + (votes === 1 ? " vote" : " votes");

    const percentage =
      total === 0 ? 0 : (votes / total) * 100;

    document.getElementById("bar" + number).style.width =
      percentage + "%";
  });
}


document.getElementById("pollForm").addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const selected =
      document.querySelector('input[name="person"]:checked');

    if (!selected) {

      document.getElementById("message").textContent =
        "⚠️ Please select one person.";

      return;
    }

    const voteButton =
      document.getElementById("voteButton");

    voteButton.disabled = true;

    const { error } = await supabaseClient
      .from("votes")
      .insert([
        {
          person: selected.value
        }
      ]);

    if (error) {

      console.log(error);

      document.getElementById("message").textContent =
        "❌ Something went wrong.";

      voteButton.disabled = false;

      return;
    }

    document.getElementById("message").textContent =
      "✅ Your vote has been recorded!";

    document
      .querySelectorAll('input[name="person"]')
      .forEach(input => input.disabled = true);

    await loadResults();
  }
);


loadResults();

setInterval(loadResults, 5000);

</script>

</body>
</html>
