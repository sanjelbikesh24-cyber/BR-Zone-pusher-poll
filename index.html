<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BR Ranked Zone Pusher Poll</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #1e293b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .poll-box {
      width: 100%;
      max-width: 500px;
      background: #1f2937;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .question {
      text-align: center;
      font-size: 20px;
      margin-bottom: 25px;
    }

    .player {
      width: 100%;
      padding: 16px;
      margin: 10px 0;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .player:hover {
      background: #1d4ed8;
    }

    .player:active {
      transform: scale(0.98);
    }

    .results {
      margin-top: 30px;
    }

    .result-name {
      margin-top: 15px;
      margin-bottom: 5px;
    }

    .bar {
      width: 100%;
      height: 20px;
      background: #374151;
      border-radius: 10px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 0%;
      background: #22c55e;
      transition: width 0.4s;
    }

    .percentage {
      font-size: 14px;
      color: #d1d5db;
    }

    .reset {
      margin-top: 25px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #dc2626;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="poll-box">

    <h1>🔥 BR RANKED POLL</h1>

    <div class="question">
      Who will be the <b>Zone Pusher</b> for our BR Ranked Matches?
    </div>

    <button class="player" onclick="vote('Naman Agrawal')">
      1️⃣ Naman Agrawal
    </button>

    <button class="player" onclick="vote('Niten Dhakal')">
      2️⃣ Niten Dhakal
    </button>

    <button class="player" onclick="vote('Paras Thapa')">
      3️⃣ Paras Thapa
    </button>

    <button class="player" onclick="vote('Suyog Hamal')">
      4️⃣ Suyog Hamal
    </button>

    <div class="results">

      <h2>📊 Results</h2>

      <div class="result-name">
        Naman Agrawal — <span id="naman-count">0</span> votes
        <span class="percentage" id="naman-percent">0%</span>
      </div>
      <div class="bar">
        <div class="fill" id="naman-bar"></div>
      </div>

      <div class="result-name">
        Niten Dhakal — <span id="niten-count">0</span> votes
        <span class="percentage" id="niten-percent">0%</span>
      </div>
      <div class="bar">
        <div class="fill" id="niten-bar"></div>
      </div>

      <div class="result-name">
        Paras Thapa — <span id="paras-count">0</span> votes
        <span class="percentage" id="paras-percent">0%</span>
      </div>
      <div class="bar">
        <div class="fill" id="paras-bar"></div>
      </div>

      <div class="result-name">
        Suyog Hamal — <span id="suyog-count">0</span> votes
        <span class="percentage" id="suyog-percent">0%</span>
      </div>
      <div class="bar">
        <div class="fill" id="suyog-bar"></div>
      </div>

    </div>

    <button class="reset" onclick="resetPoll()">
      🔄 Reset Poll
    </button>

  </div>

<script>

let votes = {
  "Naman Agrawal": 0,
  "Niten Dhakal": 0,
  "Paras Thapa": 0,
  "Suyog Hamal": 0
};

function vote(player) {

  votes[player]++;

  updateResults();
}

function updateResults() {

  let total = Object.values(votes)
    .reduce((sum, value) => sum + value, 0);

  const players = {
    "Naman Agrawal": "naman",
    "Niten Dhakal": "niten",
    "Paras Thapa": "paras",
    "Suyog Hamal": "suyog"
  };

  for (let player in players) {

    let id = players[player];

    let count = votes[player];

    let percentage = total === 0
      ? 0
      : Math.round((count / total) * 100);

    document.getElementById(id + "-count").innerText = count;

    document.getElementById(id + "-percent").innerText =
      percentage + "%";

    document.getElementById(id + "-bar").style.width =
      percentage + "%";
  }
}

function resetPoll() {

  votes = {
    "Naman Agrawal": 0,
    "Niten Dhakal": 0,
    "Paras Thapa": 0,
    "Suyog Hamal": 0
  };

  updateResults();
}

</script>

</body>
</html>
